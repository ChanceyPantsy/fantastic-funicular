[package]
name = "guardian_arena"
version = "0.1.0"
edition = "2021"
description = "Browser arena demo for guardian_combat, compiled to WebAssembly."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
guardian_combat = { path = "..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
