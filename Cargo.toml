[package]
name = "guardian_combat"
version = "0.1.0"
edition = "2021"
description = "Engine-agnostic combat sandbox modelled on Destiny 2's mechanics: elements, verbs, weapons, abilities, shields, champions and buff stacking."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gamedev", "combat", "destiny", "sandbox", "rpg"]
categories = ["game-development", "simulation"]

[features]
default = []
# Derive Serialize/Deserialize on all data types so weapons, abilities and
# tuning tables can be loaded from JSON/RON/TOML in a host game or mod.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[workspace]
members = [".", "demo", "demo3d"]
# demo3d pulls in Bevy, which takes ~10 minutes to build; build it explicitly.
default-members = [".", "demo"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Quicker WebAssembly builds while iterating on demo3d: optimized dependencies,
# no LTO, incremental crate builds.
[profile.webdev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
panic = "unwind"

[profile.webdev.package."*"]
opt-level = 2
